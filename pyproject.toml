[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tau2-indian-banking"
version = "1.0.0"
description = "indian_banking: an Indian retail-banking domain for tau2-bench, bundled with the tau2-bench harness"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    { name = "Krishanu Adhikary" },
    { name = "Prashant Devadiga" },
]
dependencies = [
    "huggingface_hub>=0.25",
    "rich",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
    "pandas>=2.2.3",
    "loguru>=0.7.3",
    "docstring-parser>=0.16",
    "litellm>=1.84.0,<1.85",
    "tenacity>=9.0.0",
    "deepdiff>=8.4.2",
    "addict>=2.4.0",
    "PyYAML>=6.0.2",
    "toml>=0.10.2",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-xdist>=3.5.0",
    "ruff>=0.9.1",
]

[project.urls]
Homepage = "https://github.com/npci/TauIndianBankBench"
Dataset = "https://huggingface.co/datasets/NPCI/tau-indian-banking"
"Upstream harness (tau2-bench)" = "https://github.com/sierra-research/tau2-bench"

[project.scripts]
tau2 = "tau2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tau2"]

# Ship the domain data (and the user-simulator guidelines the harness reads at
# runtime) inside the package, so a non-editable `pip install` works without a
# source checkout. `tau2.utils.utils` falls back to this directory when there is
# no `data/` next to the sources; TAU2_DATA_DIR still overrides both.
[tool.hatch.build.targets.wheel.force-include]
"data/tau2/domains/indian_banking" = "tau2/data/tau2/domains/indian_banking"
"data/tau2/user_simulator" = "tau2/data/tau2/user_simulator"

[tool.hatch.build.targets.sdist]
include = [
    "src/tau2",
    "data/tau2/domains/indian_banking",
    "data/tau2/user_simulator",
    "tests",
    "scripts",
    "README.md",
    "requirements.txt",
    "LICENSE",
    "CITATION.cff",
    "DISCLAIMER.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*:",
    "ignore:Pydantic serializer warnings:UserWarning:pydantic.*:",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F541"]

[tool.ruff]
line-length = 88
exclude = ["*.ipynb"]
